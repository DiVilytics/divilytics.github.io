  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260506" />

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6MTR91YL11"></script>

<body>

<nav>
  <a class="nav-brand" href="index.html"><img src="asset/logo-b.svg" alt="Disney Villainous Stats"></a>
  <div class="nav-right">
    <div class="nav-links">
      <a href="games.html" title="Games">🕒</a>
      <a href="leaderboard.html" title="Leaderboard">🏆</a>
      <a href="character.html" title="Characters">🎭</a>
      <a href="player.html" id="navProfile" title="Player">👤</a>
      <a href="draw.html" title="Draw">🎲</a>
    </div>
    <div class="nav-auth" id="navAuth"></div>
  </div>
</nav>

<main>
  <div class="page-header">
    <h2>Random Character Selection</h2>
  </div>

  <div class="result-card">
    <div class="result-placeholder" id="placeholder">Press the button to draw a character</div>
    <div class="result-name" id="resultName" style="display:none"></div>
  </div>

  <button class="btn-roll" onclick="roll()">Draw Character</button>

  <button class="exclude-toggle" onclick="toggleExclude()">
    <span class="exclude-toggle-label">Exclude characters</span>
    <div class="toggle-right">
      <span class="badge" id="exBadge"></span>
      <span class="chevron" id="exChevron">▼</span>
    </div>
  </button>
  <div class="exclude-body" id="excludeBody">
    <div class="filter-actions">
      <button class="txt-btn" onclick="excludeAll()">Exclude all</button>
      <span class="sep">·</span>
      <button class="txt-btn" onclick="clearExcluded()">Clear</button>
      <button class="btn btn-primary btn-sm filter-apply-btn" onclick="applyExclude()">Apply filter</button>
    </div>
    <div id="excludeGrid"></div>
  </div>

  <hr class="draw-divider">

  <div class="page-header">
    <h2>Randomize Play Order</h2>
  </div>

  <div id="orderSlots"></div>
  <button class="add-row-btn" id="orderAddBtn" onclick="addOrderSlot()">+ Add player</button>

  <button class="btn-roll" id="groupBtn" onclick="randomizeGroup()" style="margin-top:12px" disabled>Randomize</button>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="db.js"></script>
  <script src="ui.js"></script>
  <script src="shared.js"></script>
<script src="draw.js"></script>
</body>
</html>
